[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhgoa-fraud-agent"
version = "0.1.0"
description = "TigerGraph agentic fraud investigation pilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "langchain-mcp-adapters>=0.1", "langgraph-checkpoint-postgres>=3.1", "tigergraph-mcp>=1.0.3"]
prod = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]
evaluation = ["scikit-learn>=1.5"]

[project.scripts]
hhgoa = "app.cli:main"
hhgoa-tigergraph-admin = "app.tg_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
